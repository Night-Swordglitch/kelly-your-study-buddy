<div class="root-view" id="view-login">
  <div class="auth-shell">
    <div class="auth-side">
      <button class="icon-btn on-dark auth-back" onclick="showRoot('view-landing')">‹</button>
      <div class="auth-side-content">
        <div class="kelly-mount" data-mood="waving" data-theme="gold" data-size="170"></div>
        <h2>Good to see you again.</h2>
        <p>Pick up right where you left off — I've kept track of everything.</p>
      </div>
    </div>
    <div class="auth-form-side">
      <div class="auth-form-wrap">
        <button class="logo" onclick="showRoot('view-landing')">
          <div class="kelly-mount" data-mood="happy" data-theme="gold" data-size="32"></div>
          <span class="logo-word">KELLY</span>
        </button>
        <h1>Log in</h1>
        <p class="sub">Let's get back to studying.</p>
        <form onsubmit="return handleLogin(event)">
          <div class="form-field">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required placeholder="you@university.edu">
          </div>
          <div class="form-field">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" required placeholder="••••••••">
          </div>
          <div class="flex justify-between items-center" style="margin-bottom:20px;">
            <label class="checkbox-row"><input type="checkbox" style="width:15px;height:15px;">Remember me</label>
            <button type="button" class="link-btn" style="font-size:13.5px;" onclick="handleForgotPassword()">Forgot password?</button>
          </div>
          <button type="submit" class="btn btn-primary btn-lg btn-block" id="login-submit-btn">
            <span class="btn-spinner" id="login-spinner"></span>
            <span class="btn-label">Log In</span>
          </button>
          <div class="auth-error-msg" id="login-error"></div>
          <div class="inline-note" id="forgot-note">We'd send a reset link to that email — no reset needed in this preview 🙂</div>
        </form>
        <div class="form-divider"><span>or</span></div>
        <button class="btn btn-ghost btn-block" style="gap:10px;" onclick="handleGoogleAuth('login')">
          <span class="g-badge"><svg width="14" height="14" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg></span> Continue with Google
        </button>
        <p class="auth-switch">Don't have an account? <button class="link-btn" onclick="showRoot('view-signup')">Create Account</button></p>
      </div>
    </div>
  </div>
</div>
